<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MMORP · Puertas que Hablan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&family=Bebas+Neue&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    :root {
      --yellow: #FFE000;
      --black:  #0a0a0a;
      --gray:   #1e1e1e;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: var(--yellow);
      color: var(--black);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
    }

    /* ── Layout principal ── */
    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* ── Logo MMORP ── */
    .logo-mmorp {
      mix-blend-mode: screen;
      width: clamp(200px, 55vw, 320px);
      margin-bottom: 0.6rem;
      
      opacity: 0;
      animation: fadeDown 0.7s ease 0.2s forwards;
    }

    /* ── Subtítulo exploración ── */
    .exp-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(1rem, 4vw, 1.4rem);
      letter-spacing: 0.22em;
      color: var(--black);
      opacity: 0;
      animation: fadeDown 0.7s ease 0.4s forwards;
      margin-bottom: 3rem;
    }

    /* ── Divider ── */
    .divider {
      width: 40px;
      height: 2px;
      background: var(--black);
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeDown 0.7s ease 0.5s forwards;
    }

    /* ── Pulso ── */
    .status-area {
      opacity: 0;
      animation: fadeDown 0.7s ease 0.65s forwards;
    }

    .pulse-ring {
      width: 44px;
      height: 44px;
      border: 2px solid var(--black);
      border-radius: 50%;
      margin: 0 auto 1.2rem;
      position: relative;
      animation: pulseRing 1.5s ease-in-out infinite;
    }
    .pulse-ring::after {
      content: '';
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(0,0,0,0.4);
      border-radius: 50%;
      animation: pulseRing 1.5s ease-in-out 0.35s infinite;
    }
    @keyframes pulseRing {
      0%,100% { transform: scale(1); opacity:1; }
      50% { transform: scale(1.18); opacity:0.4; }
    }

    .status-text {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--black);
      min-height: 1.2em;
    }

    /* ── Error ── */
    .error-area {
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .error-area.visible {
      display: block;
      opacity: 1;
    }

    .error-icon {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }
    .error-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
    }
    .error-desc {
      font-size: 0.78rem;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #333;
      line-height: 1.7;
      max-width: 300px;
      margin: 0 auto 1.8rem;
    }

    .btn-retry {
      display: inline-block;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      color: var(--yellow);
      background: var(--black);
      border: none;
      padding: 0.8em 2.2em;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.8rem;
    }
    .btn-retry:hover { background: #333; }

    .btn-secondary {
      display: block;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #444;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      margin-top: 0.4rem;
    }
    .btn-secondary:hover { color: var(--black); border-color: var(--black); }

    /* ── Éxito ── */
    .success-area { display: none; }
    .success-area.visible {
      display: block;
      animation: fadeDown 0.5s ease forwards;
    }
    .check-circle {
      width: 52px; height: 52px;
      border: 2px solid var(--black);
      border-radius: 50%;
      margin: 0 auto 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }
    .success-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      margin-bottom: 0.3rem;
    }
    .success-id {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      color: #444;
    }

    /* ── Footer ── */
    footer {
      background: var(--black);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .footer-logo {
      mix-blend-mode: screen;
      height: 28px;
      mix-blend-mode: screen;
      opacity: 0.9;
    }

    .footer-socials {
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .footer-socials a {
      color: var(--yellow);
      text-decoration: none;
      display: flex;
      align-items: center;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .footer-socials a:hover { opacity: 1; }
    .footer-socials svg { width: 20px; height: 20px; fill: var(--yellow); }

    .footer-copy {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      color: rgba(255,224,0,0.4);
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      margin-top: 0.2rem;
    }

    @keyframes fadeDown {
      from { opacity:0; transform: translateY(-10px); }
      to   { opacity:1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="page">

  <main class="main">

    <img src="/MMORP_logo_negro.png" alt="MMORP" class="logo-mmorp" />

    <p class="exp-label">Puertas que Hablan</p>
    <div class="divider"></div>

    <!-- Cargando -->
    <div class="status-area" id="statusArea">
      <div class="pulse-ring"></div>
      <p class="status-text" id="statusText">Obteniendo ubicación…</p>
    </div>

    <!-- Error -->
    <div class="error-area" id="errorArea">
      <div class="error-icon">🚪</div>
      <p class="error-title">Acceso requerido</p>
      <p class="error-desc" id="errorDesc">
        Necesitamos tu ubicación para mostrarte la puerta patrimonial más cercana a ti.
      </p>
      <button class="btn-retry" id="btnRetry">Intentar de nuevo</button>
      <a href="https://mmorp-db.web.app" class="btn-secondary" id="btnFallback">Explorar el museo →</a>
    </div>

    <!-- Éxito -->
    <div class="success-area" id="successArea">
      <div class="check-circle">✦</div>
      <p class="success-text">Puerta encontrada</p>
      <p class="success-id" id="successId">—</p>
    </div>

  </main>

  <footer>
    <img src="/cammarq_b.png" alt="CAMMARQ" class="footer-logo" />

  </footer>

</div>


</body>
